[package]
name = "anime2ctxdb"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "anime2ctxdb-gui"
path = "src/bin/gui/main.rs"

[[bin]]
name = "anime2ctxdb"
path = "src/bin/cli/main.rs"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["wgpu"] }
fs4 = "1.1.0"
regex = "1.13.1"
rfd = "0.17.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skrifa = "0.44.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "allow"
missing_debug_implementations = "warn"
unused_results = "allow"
elided_lifetimes_in_paths = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
todo = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
rc_buffer = "warn"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
